<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentSync · 2画面の構想</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e6df;color:#26251f;font:14px -apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}button,select,textarea{font:inherit;color:inherit}button,select{cursor:pointer}button{border:1px solid #d9d3c3;border-radius:8px;background:transparent;padding:9px 12px}button:hover{background:#e6e1d4}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #2f7d62;outline-offset:2px}.intro{max-width:1400px;margin:30px auto 18px;padding:0 26px;display:flex;align-items:end;justify-content:space-between;gap:20px}.eyebrow{font-size:11px;letter-spacing:2px;color:#85765e}h1{font-size:25px;font-weight:500;margin:9px 0}.intro p{color:#706c60;margin:0;font-size:12px}.scenarios{display:flex;gap:8px}.scenarios button{background:#faf9f5;font-size:12px}.window{height:calc(100dvh - 170px);min-height:460px;max-width:1400px;margin:0 auto 20px;background:#faf9f5;border:1px solid #d3cdbf;border-radius:14px;overflow:hidden;box-shadow:0 20px 70px #4c44381a;display:grid;grid-template-columns:205px 1fr}.sidebar{background:#f2efe6;border-right:1px solid #e3ded1;padding:22px 15px;display:flex;flex-direction:column;gap:10px}.lights{display:flex;gap:7px;margin-bottom:20px}.lights i{width:11px;height:11px;background:#d4cdbf;border-radius:50%}.brand{font:24px Georgia,serif;margin:0 8px 22px}.sidebar small{color:#827c70;font-size:11px;padding:15px 10px 5px}.thread{text-align:left;border:0;padding:14px 12px}.thread span{display:block;color:#837e73;font-size:11px;margin-top:7px}.thread.selected{background:#e6e1d4}.sidefoot{margin-top:auto;color:#898173;padding:12px;font-size:12px}.workspace{display:flex;flex-direction:column;min-width:0;min-height:0}.toolbar{height:52px;flex-shrink:0;border-bottom:1px solid #e3ded1;display:flex;align-items:center;justify-content:flex-end;padding:0 20px;color:#837c6d;font-size:11px}.splitbtn{padding:6px 10px;color:#2f7d62;background:#e5eee7;display:flex;gap:8px;align-items:center}.panes{display:flex;flex:1;min-height:0;min-width:0}.pane{display:flex;flex-direction:column;min-width:0;flex:1;position:relative}.pane.active{box-shadow:inset 0 2px #2f7d62}.pane header{padding:19px 20px 15px;border-bottom:1px solid #e3ded1;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}.pane select{border:0;background:transparent;font-weight:600;max-width:100%}.models{font-size:10px;color:#817c70;display:flex;gap:9px}.models span{border:1px solid #e3ded1;border-radius:20px;padding:5px 8px}.feed{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0;padding:25px 24px;scrollbar-gutter:stable}.stamp{text-align:center;color:#9c9486;font-size:10px;margin-bottom:25px}.msg{margin-bottom:26px;line-height:1.85}.author{font-size:11px;font-weight:600;margin-bottom:8px;display:flex;gap:8px;align-items:center}.avatar{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:#efe1d6;color:#b5532f}.gpt .avatar{background:#deece3;color:#2f7d62}.bubble{background:#e9e4d8;padding:14px 17px;border-radius:13px;max-width:88%;margin-left:auto;font-size:13px}.answer{font-size:13px;padding-left:32px}.answer p{margin:0 0 12px}.log{font-size:11px;color:#8a7e6a;border:1px solid #e3ded1;border-radius:7px;padding:10px 12px;margin:12px 0}.composer{margin:0 16px 16px;border:1px solid #d9d3c3;border-radius:12px;background:#fff;padding:12px;flex-shrink:0}.recipient{font-size:10px;color:#8d8273}.composer textarea{resize:vertical;border:0;background:transparent;width:100%;height:45px;min-height:40px;padding:12px 0;font-size:12px}.composefoot{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#928a7c}.send{background:#2f7d62;color:white;border:0;font-size:11px}.divider{width:7px;flex-shrink:0;background:#eeeae1;cursor:col-resize;touch-action:none;display:grid;place-items:center}.divider:after{content:'';height:30px;width:2px;background:#c3bcac;border-radius:2px}.single #right,.single .divider{display:none}.caption{max-width:1400px;margin:0 auto;padding:0 26px;color:#827866;font-size:11px}.notice{color:#2f7d62} @media(max-width:850px){.window{grid-template-columns:145px 1fr;border-radius:0}.intro{align-items:start;flex-direction:column;margin-top:18px}.intro h1{font-size:21px}.window{height:72dvh}.sidebar{padding:18px 8px}.brand{font-size:20px}.models{display:none}.feed{padding:18px 12px}.pane header{padding:16px 8px}.composer{margin:0 8px 10px}.answer{padding-left:0}.caption{line-height:1.8}.scenarios{flex-wrap:wrap}}@media print{body{background:white}.intro{margin:10px auto}.window{height:680px;box-shadow:none}.caption{color:#555}.scenarios{display:none}}
</style>
<div class="intro"><div><div class="eyebrow">AGENTSYNC / DESIGN STUDY 04</div><h1>読み返しながら、会話を進める。</h1><p>2画面表示の操作モック · 実際のAIには接続しません</p></div><div class="scenarios"><button id="same">同じスレッドを比較</button><button id="different">別のスレッドを並べる</button><button onclick="window.print()">印刷 / PDF</button></div></div>
<div class="window"><aside class="sidebar"><div class="lights"><i></i><i></i><i></i></div><div class="brand">AgentSync</div><small>スレッド</small><button class="thread" data-id="design">2画面表示の設計<span>左右で、違う場所を読む</span></button><button class="thread" data-id="build">実装の相談<span>画面構成と状態の管理</span></button><button class="thread" data-id="release">公開の準備<span>v0.1.0 のチェック</span></button><div class="sidefoot">◌ 連携　　◷ 使用量</div></aside><div class="workspace"><div class="toolbar"><button class="splitbtn" id="split" aria-label="2画面表示の切り替え" aria-pressed="true" title="選択中の画面を残して1画面にする"><svg width="18" height="16" viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1" y="1" width="22" height="18" rx="3"/><path d="M12 1v18"/></svg></button></div><div class="panes"><section class="pane active" id="left" aria-label="左の画面"></section><div class="divider" role="separator" tabindex="0" aria-label="左右の幅を調整" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75" aria-valuenow="50"></div><section class="pane" id="right" aria-label="右の画面"></section></div></div></div><p class="caption">画面をクリックして選択 → サイドバーで切り替え。タイトル横からも選択できます。中央の境界はドラッグ、または矢印キーで調整。<span class="notice">左右のスクロールは独立しています。</span></p>
<script>
const threads={design:{title:'2画面表示の設計',questions:['同じ会話を、違う位置で読みたい。','別のスレッドも並べられるようにしたい。','スクロールは別々に動かしたい。','この構成ならどう使えそう？'],answers:['右上の画面アイコンから、左右に分割できます。左に過去の構想、右に最新の返事を置いて読み進められます。','各画面のタイトルからスレッドを切り替えます。同じスレッドを左右に選ぶこともできます。','スクロール位置と最新への追従は、画面ごとに管理します。片側を読んでいる間も、もう片側はその位置を保ちます。','左で要件を確かめながら、右で実装の相談を進められます。入力欄はそれぞれの画面の下に置きます。']},build:{title:'実装の相談',questions:['2画面の構成を考えて。','状態はどこで管理する？','ショートカットの対象は？','最初に確認したい動作は？'],answers:['App で左右それぞれのスレッドIDと、選択中の画面を管理する構成が考えられます。','会話の内容はスレッド単位、スクロールや書きかけの文章は画面単位で扱います。','停止と対話モードの操作は、選択中の画面のスレッドだけに適用します。','同じスレッドを2つ開き、左を過去の位置にしたまま右から送信して、左が動かないことを確認します。']},release:{title:'公開の準備',questions:['公開前に確認したいことは？','READMEはどう直す？','最終確認の項目をまとめて。','その後の進め方は？'],answers:['機密情報と履歴、導入方法、既知の制限を確認します。','アプリの履歴はローカルに保存され、応答生成には各サービスへの送信があることを説明します。','テスト、型チェック、ビルドに加え、送信・停止・再開の動作を実機で確かめます。','v0.1.0 で区切り、日々使う中で見つかった不便を次の改善候補にします。']}};
let active='left',split=true;const ids={left:'design',right:'design'},drafts={left:'',right:''},extras={design:[],build:[],release:[]};
function select(side){active=side;document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.id===side));document.querySelectorAll('.thread').forEach(b=>b.classList.toggle('selected',b.dataset.id===ids[side]));}
function message(author,text){const box=document.createElement('div');box.className='msg '+(author==='GPT'?'gpt':'');if(author==='あなた'){const b=document.createElement('div');b.className='bubble';b.textContent=text;box.append(b);}else{const a=document.createElement('div');a.className='author';const icon=document.createElement('span');icon.className='avatar';icon.textContent=author==='GPT'?'G':'C';a.append(icon,document.createTextNode(author));const b=document.createElement('div');b.className='answer';b.textContent=text;box.append(a,b);}return box;}
function render(side){const pane=document.getElementById(side),t=threads[ids[side]];pane.innerHTML='<header><select aria-label="表示するスレッド"></select><div class="models"><span>● Claude</span><span>● GPT</span></div></header><div class="feed" tabindex="0" aria-label="独立してスクロールできる会話"><div class="stamp">今日 · 画面構想のサンプル</div></div><form class="composer"><div class="recipient">宛先：全員</div><textarea aria-label="'+(side==='left'?'左':'右')+'のメッセージ" placeholder="メッセージを入力…"></textarea><div class="composefoot"><span>モック内でのみ送信</span><button class="send" type="submit">送信 ↑</button></div></form>';const picker=pane.querySelector('select');Object.entries(threads).forEach(([id,x])=>picker.add(new Option(x.title,id)));picker.value=ids[side];picker.onchange=()=>{ids[side]=picker.value;drafts[side]='';render(side);select(side);};const feed=pane.querySelector('.feed');t.questions.forEach((q,i)=>{feed.append(message('あなた',q),message(i%2?'GPT':'Claude',t.answers[i]));});extras[ids[side]].forEach(x=>feed.append(message('あなた',x)));pane.querySelector('textarea').value=drafts[side];pane.querySelector('textarea').oninput=e=>drafts[side]=e.target.value;pane.onpointerdown=()=>select(side);pane.onfocusin=()=>select(side);pane.querySelector('form').onsubmit=e=>{e.preventDefault();const text=drafts[side].trim();if(!text)return;extras[ids[side]].push(text);drafts[side]='';['left','right'].filter(s=>ids[s]===ids[side]).forEach(s=>{const p=document.getElementById(s);p.querySelector('.feed').append(message('あなた',text));if(s===side){p.querySelector('textarea').value='';p.querySelector('.feed').scrollTop=p.querySelector('.feed').scrollHeight;}});};}
const windowBox=document.querySelector('.window'),toggle=document.getElementById('split');function layout(){windowBox.classList.toggle('single',!split);toggle.setAttribute('aria-pressed',String(split));toggle.title=split?'選択中の画面を残して1画面にする':'同じスレッドを右にも開く';if(!split){if(active==='right'){ids.left=ids.right;drafts.left=drafts.right;const y=document.querySelector('#right .feed').scrollTop;render('left');document.querySelector('#left .feed').scrollTop=y;}document.getElementById('left').style.flex='1';select('left');}else{document.getElementById('left').style.flex='1';document.getElementById('right').style.flex='1';}}
toggle.onclick=()=>{if(!split){ids.right=ids.left;drafts.right='';render('right');document.querySelector('#right .feed').scrollTop=document.querySelector('#left .feed').scrollTop;}split=!split;layout();};document.querySelectorAll('.thread').forEach(b=>b.onclick=()=>{ids[active]=b.dataset.id;drafts[active]='';render(active);select(active);});function scenario(different){split=true;ids.left='design';ids.right=different?'build':'design';render('left');render('right');layout();document.querySelector('#right .feed').scrollTop=99999;select('left');}document.getElementById('same').onclick=()=>scenario(false);document.getElementById('different').onclick=()=>scenario(true);
const divider=document.querySelector('.divider');let ratio=50;function resize(value){ratio=Math.max(25,Math.min(75,value));document.getElementById('left').style.flex=ratio+' 1 0';document.getElementById('right').style.flex=(100-ratio)+' 1 0';divider.setAttribute('aria-valuenow',Math.round(ratio));}divider.onpointerdown=e=>{divider.setPointerCapture(e.pointerId);};divider.onpointermove=e=>{if(!divider.hasPointerCapture(e.pointerId))return;const r=document.querySelector('.panes').getBoundingClientRect();resize((e.clientX-r.left)/r.width*100);};divider.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();resize(ratio+(e.key==='ArrowRight'?2:-2));}};scenario(false);
</script></html>
