<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 07 頭文字 A: the A of AgentSync, one leg orange and one green, with 「…」 as the crossbar. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2E45"/>
      <stop offset="1" stop-color="#0B0C14"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="left" gradientUnits="userSpaceOnUse" x1="0" y1="240" x2="0" y2="792">
      <stop offset="0" stop-color="#FFB892"/><stop offset="1" stop-color="#C9471C"/>
    </linearGradient>
    <linearGradient id="right" gradientUnits="userSpaceOnUse" x1="0" y1="240" x2="0" y2="792">
      <stop offset="0" stop-color="#93F5D0"/><stop offset="1" stop-color="#0B7A5A"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-30%" width="180%" height="160%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="shadow" color-interpolation-filters="sRGB" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#tile)" stroke-linecap="round">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    <g filter="url(#glow)" opacity="0.65" stroke-width="100">
      <line x1="512" y1="240" x2="290" y2="792" stroke="url(#left)"/>
      <line x1="512" y1="240" x2="734" y2="792" stroke="url(#right)"/>
    </g>
    <g filter="url(#soft)" stroke-width="100">
      <line x1="512" y1="240" x2="290" y2="792" stroke="url(#left)"/>
      <line x1="512" y1="240" x2="734" y2="792" stroke="url(#right)"/>
    </g>
    <g fill="#FBF8F1" filter="url(#soft)">
      <circle cx="456" cy="604" r="22"/>
      <circle cx="512" cy="604" r="22"/>
      <circle cx="568" cy="604" r="22"/>
    </g>
  </g>
</svg>
