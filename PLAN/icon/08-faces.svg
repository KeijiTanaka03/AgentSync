<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 08 二人の顔: two speech bubbles with faces (Claude orange, GPT green) looking at each other, on cream. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF6"/>
      <stop offset="1" stop-color="#EAE3D3"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F08452"/>
      <stop offset="1" stop-color="#CF5626"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2FC290"/>
      <stop offset="1" stop-color="#138A66"/>
    </linearGradient>
    <filter id="shadow" color-interpolation-filters="sRGB" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5A4632" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g transform="translate(-7 27)" filter="url(#lift)">
    <path fill="url(#orange)" d="M288 318 H388 A120 120 0 0 1 508 438 V508 A120 120 0 0 1 388 628 H300 C266 662 214 688 160 700 C178 660 168 600 168 552 V438 A120 120 0 0 1 288 318 Z"/>
    <path fill="url(#green)" d="M636 270 H736 A120 120 0 0 1 856 390 V460 C856 510 860 590 878 650 C826 636 778 610 750 580 H636 A120 120 0 0 1 516 460 V390 A120 120 0 0 1 636 270 Z"/>
  </g>
  <g transform="translate(-7 27)">
    <!-- Claude looks right, GPT looks left -->
    <g fill="#FFFFFF">
      <ellipse cx="292" cy="458" rx="30" ry="38"/>
      <ellipse cx="386" cy="458" rx="30" ry="38"/>
      <ellipse cx="640" cy="410" rx="30" ry="38"/>
      <ellipse cx="734" cy="410" rx="30" ry="38"/>
    </g>
    <g fill="#1F1E1D">
      <circle cx="303" cy="462" r="16"/>
      <circle cx="397" cy="462" r="16"/>
      <circle cx="629" cy="414" r="16"/>
      <circle cx="723" cy="414" r="16"/>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round">
      <path d="M306 540 Q339 566 372 540"/>
      <path d="M654 492 Q687 518 720 492"/>
    </g>
  </g>
</svg>
