<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 04 ネオンの吹き出し: two neon-tube speech bubbles (orange, green) glowing on black. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1B24"/>
      <stop offset="1" stop-color="#050508"/>
    </linearGradient>
    <filter id="wide" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="near" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="shadow" color-interpolation-filters="sRGB" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <path id="back" d="M330 230 H530 A120 120 0 0 1 650 350 V420 A120 120 0 0 1 530 540 H356 C322 574 262 598 204 608 C222 566 214 506 214 452 V350 A120 120 0 0 1 330 230 Z"/>
    <path id="front" d="M494 446 H694 A120 120 0 0 1 814 566 V656 C814 714 822 772 840 818 C788 804 740 784 706 752 H494 A120 120 0 0 1 374 632 V566 A120 120 0 0 1 494 446 Z"/>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#tile)" fill="none" stroke-linejoin="round">
    <g>
      <use href="#back" stroke="#FF5F1F" stroke-width="44" filter="url(#wide)" opacity="0.85"/>
      <use href="#back" stroke="#FF7436" stroke-width="30" filter="url(#near)"/>
      <use href="#back" stroke="#FF8A52" stroke-width="28"/>
      <use href="#back" stroke="#FFE7D8" stroke-width="10"/>
    </g>
    <g style="mix-blend-mode:screen">
      <use href="#front" stroke="#10E294" stroke-width="44" filter="url(#wide)" opacity="0.85"/>
      <use href="#front" stroke="#22EFA4" stroke-width="30" filter="url(#near)"/>
      <use href="#front" stroke="#3CF2B0" stroke-width="28"/>
      <use href="#front" stroke="#E2FFF4" stroke-width="10"/>
    </g>
    <g fill="#E2FFF4" stroke="none" style="mix-blend-mode:screen">
      <circle cx="510" cy="600" r="22"/>
      <circle cx="594" cy="600" r="22"/>
      <circle cx="678" cy="600" r="22"/>
    </g>
  </g>
</svg>
