<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 10 ターミナルの吹き出し: a speech bubble shaped like a terminal window, with an orange 「>」 and a green 「_」
       (AgentSync talks to the Claude Code and Codex CLIs). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26272F"/>
      <stop offset="1" stop-color="#0A0A0D"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D3E48"/>
      <stop offset="1" stop-color="#22232A"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB089"/>
      <stop offset="1" stop-color="#E5612E"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2CC08F"/>
      <stop offset="1" stop-color="#8AF2CB"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="shadow" color-interpolation-filters="sRGB" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    <path fill="url(#window)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="4" filter="url(#lift)"
      d="M272 236 H752 A96 96 0 0 1 848 332 V616 A96 96 0 0 1 752 712 H330 C300 746 252 776 196 790 C214 756 176 722 176 660 V332 A96 96 0 0 1 272 236 Z"/>
    <g>
      <circle cx="262" cy="318" r="15" fill="#EE7442"/>
      <circle cx="308" cy="318" r="15" fill="#22B887"/>
      <circle cx="354" cy="318" r="15" fill="#FFFFFF" opacity="0.35"/>
    </g>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="56">
      <g filter="url(#glow)" opacity="0.7">
        <path d="M300 430 L420 510 L300 590" stroke="#F0703C"/>
        <path d="M480 590 H660" stroke="#1FC08A"/>
      </g>
      <path d="M300 430 L420 510 L300 590" stroke="url(#orange)"/>
      <path d="M480 590 H660" stroke="url(#green)"/>
    </g>
  </g>
</svg>
