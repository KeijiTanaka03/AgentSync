<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 05 無限ループ: an endless ribbon, orange on one side and green on the other,
       for a dialogue that goes on until you stop it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2545"/>
      <stop offset="1" stop-color="#0B0A14"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="874" y2="0">
      <stop offset="0" stop-color="#B53E17"/>
      <stop offset="0.3" stop-color="#F07B48"/>
      <stop offset="0.47" stop-color="#FFB08A"/>
      <stop offset="0.53" stop-color="#8CF2CC"/>
      <stop offset="0.7" stop-color="#22B887"/>
      <stop offset="1" stop-color="#086A4E"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="shadow" color-interpolation-filters="sRGB" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <path id="loop" d="M 512 512 C 610 330 840 330 840 512 C 840 694 610 694 512 512 C 414 330 184 330 184 512 C 184 694 414 694 512 512 Z"/>
    <!-- the strand that passes over at the crossing -->
    <path id="over" d="M 397.93 626.66 C 441.32 604.82 482.6 566.6 512 512 C 541.4 457.4 582.68 419.18 626.07 397.34"/>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#tile)" fill="none">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    <g transform="translate(512 512) scale(0.86) translate(-512 -512)">
      <use href="#loop" stroke="url(#ribbon)" stroke-width="92" filter="url(#glow)" opacity="0.55"/>
      <use href="#loop" stroke="url(#ribbon)" stroke-width="92"/>
      <use href="#loop" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="12"/>
      <use href="#over" stroke="#16142A" stroke-width="122"/>
      <use href="#over" stroke="url(#ribbon)" stroke-width="92"/>
      <use href="#over" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="12"/>
    </g>
  </g>
</svg>
