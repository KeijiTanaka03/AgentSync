<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.78">
      <stop offset="0" stop-color="#2D3150"/>
      <stop offset="1" stop-color="#080911"/>
    </radialGradient>
    <radialGradient id="orange" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFE6D6"/>
      <stop offset="0.26" stop-color="#FF9C66"/>
      <stop offset="0.72" stop-color="#CC481D"/>
      <stop offset="1" stop-color="#6E1F06"/>
    </radialGradient>
    <radialGradient id="green" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#E0FFF3"/>
      <stop offset="0.26" stop-color="#5AE3B1"/>
      <stop offset="0.72" stop-color="#0F8865"/>
      <stop offset="1" stop-color="#033A2B"/>
    </radialGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="160" y1="0" x2="864" y2="0">
      <stop offset="0" stop-color="#FFB487"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#86F0C6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="36"/></filter>
    <filter id="ringGlow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="shadow" color-interpolation-filters="sRGB" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="upper"><rect x="0" y="0" width="1024" height="512"/></clipPath>
    <clipPath id="lower"><rect x="0" y="512" width="1024" height="512"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#tile)">
    <g fill="#FFFFFF">
      <circle cx="250" cy="270" r="5" opacity="0.6"/>
      <circle cx="790" cy="760" r="4" opacity="0.5"/>
      <circle cx="300" cy="780" r="3" opacity="0.4"/>
      <circle cx="760" cy="230" r="3" opacity="0.45"/>
    </g>
    <g transform="rotate(-26 512 512)">
      <ellipse cx="512" cy="512" rx="356" ry="118" fill="none" stroke="url(#ring)" stroke-width="18" clip-path="url(#upper)" opacity="0.5"/>
    </g>
    <g filter="url(#glow)" opacity="0.8">
      <circle cx="374" cy="588" r="140" fill="#F0703C"/>
      <circle cx="650" cy="436" r="140" fill="#1FC08A"/>
    </g>
    <circle cx="374" cy="588" r="140" fill="url(#orange)"/>
    <circle cx="650" cy="436" r="140" fill="url(#green)"/>
    <g transform="rotate(-26 512 512)">
      <ellipse cx="512" cy="512" rx="356" ry="118" fill="none" stroke="url(#ring)" stroke-width="22" clip-path="url(#lower)" filter="url(#ringGlow)" opacity="0.7"/>
      <ellipse cx="512" cy="512" rx="356" ry="118" fill="none" stroke="url(#ring)" stroke-width="18" clip-path="url(#lower)"/>
    </g>
  </g>
</svg>
