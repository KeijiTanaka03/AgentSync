<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 09 声の波形: one dark speech bubble holding a waveform whose bars take turns, orange and green. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7E5DF"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C2D35"/>
      <stop offset="1" stop-color="#17181D"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA67A"/>
      <stop offset="1" stop-color="#E0602F"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FEABF"/>
      <stop offset="1" stop-color="#15A077"/>
    </linearGradient>
    <filter id="shadow" color-interpolation-filters="sRGB" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-50%" y="-30%" width="200%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <path fill="url(#bubble)" filter="url(#lift)" d="M346 258 H678 A160 160 0 0 1 838 418 V546 A160 160 0 0 1 678 706 H380 C338 750 272 790 200 808 C226 758 186 700 186 600 V418 A160 160 0 0 1 346 258 Z"/>
  <g id="bars">
    <rect x="254" y="442" width="36" height="80" rx="18" fill="url(#orange)"/>
    <rect x="314" y="397" width="36" height="170" rx="18" fill="url(#green)"/>
    <rect x="374" y="357" width="36" height="250" rx="18" fill="url(#orange)"/>
    <rect x="434" y="412" width="36" height="140" rx="18" fill="url(#green)"/>
    <rect x="494" y="332" width="36" height="300" rx="18" fill="url(#orange)"/>
    <rect x="554" y="387" width="36" height="190" rx="18" fill="url(#green)"/>
    <rect x="614" y="352" width="36" height="260" rx="18" fill="url(#orange)"/>
    <rect x="674" y="407" width="36" height="150" rx="18" fill="url(#green)"/>
    <rect x="734" y="437" width="36" height="90" rx="18" fill="url(#orange)"/>
  </g>
  <use href="#bars" filter="url(#glow)" opacity="0.45"/>
</svg>
